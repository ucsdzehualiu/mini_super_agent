<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>模型设置</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{margin:0;background:#11131a;color:#d7dce5;
      font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
 .wrap{max-width:760px;margin:0 auto;padding:28px 20px}
 h1{font-size:18px;margin:0 0 6px}
 .hint{color:#8b93a4;font-size:13px;margin-bottom:22px}
 label{display:block;margin:14px 0 5px;font-size:13px;color:#9aa4b8}
 input,select{width:100%;background:#0e1118;border:1px solid #2a3143;color:#d7dce5;
              border-radius:8px;padding:9px 12px;font-size:14px;outline:none}
 input:focus,select:focus{border-color:#3b82f6}
 .row{display:flex;gap:14px}.row>div{flex:1}
 button{margin-top:22px;background:#1f6feb;color:#fff;border:0;border-radius:8px;
        padding:10px 18px;font-size:14px;cursor:pointer}
 button.ghost{background:#243044;color:#cfe1ff;margin-left:8px}
 #msg{margin-top:16px;font-size:13px}
 .ok{color:#5ddc9a}.err{color:#ff7b72}
 code{background:#1b1f2b;padding:1px 5px;border-radius:4px;font-size:12.5px}
 a{color:#8ec7ff}
</style></head><body><div class="wrap">
<h1>模型设置</h1>
<div class="hint">保存到 <code>config.json</code>，重启控制台后生效。
Key 只在本机保存，不会写进日志。</div>

<label>供应商</label>
<select id="provider">
  <option value="huawei-maas">华为云 MaaS</option>
  <option value="deepseek">DeepSeek 官方</option>
  <option value="openai">OpenAI</option>
  <option value="ollama">本地 Ollama</option>
  <option value="fake">内置假数据（不联网）</option>
</select>

<label>Base URL</label>
<input id="base_url" placeholder="https://api.modelarts-maas.com/openai/v1">

<label>模型名</label>
<input id="model_name" placeholder="deepseek-v4.1-flash">

<label>API Key</label>
<input id="api_key" type="password" placeholder="留空表示不修改">

<div class="row">
  <div><label>temperature</label><input id="temperature" type="number" step="0.1" min="0" max="2"></div>
  <div><label>max_tokens</label><input id="max_tokens" type="number" min="64" max="32768"></div>
</div>

<button id="save">保存</button>
<button class="ghost" onclick="location.href='/'">返回控制台</button>
<div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
let presets = {};
async function load() {
  const d = await (await fetch('/api/config')).json();
  presets = d.presets || {};
  const c = d.config.model;
  $('#provider').value = c.provider || 'fake';
  $('#base_url').value = c.base_url || '';
  $('#model_name').value = c.model_name || '';
  $('#temperature').value = c.temperature ?? 0.6;
  $('#max_tokens').value = c.max_tokens ?? 2048;
  $('#api_key').placeholder = c.has_key ? `已保存（${c.api_key}），留空不修改` : '粘贴你的 API Key';
  $('#msg').textContent = '当前：' + d.current;
  $('#msg').className = '';
}
$('#provider').addEventListener('change', () => {
  const p = presets[$('#provider').value];
  if (p) { $('#base_url').value = p.base_url; $('#model_name').value = p.model_name; }
});
$('#save').addEventListener('click', async () => {
  const body = {
    provider: $('#provider').value,
    base_url: $('#base_url').value.trim(),
    model_name: $('#model_name').value.trim(),
    temperature: parseFloat($('#temperature').value || '0.6'),
    max_tokens: parseInt($('#max_tokens').value || '2048', 10),
  };
  const key = $('#api_key').value.trim();
  if (key) body.api_key = key;
  const r = await (await fetch('/api/config', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})).json();
  $('#msg').textContent = r.ok ? '已保存。重启控制台后生效。' : '保存失败';
  $('#msg').className = r.ok ? 'ok' : 'err';
});
load();
</script></div></body></html>
